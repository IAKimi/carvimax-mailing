services:
  postialo-db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: postialo_mailing
      POSTGRES_USER: postialo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_esta_password}
    volumes:
      - postialo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postialo -d postialo_mailing"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postialo-net

  postialo-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postialo-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postialo:${POSTGRES_PASSWORD:-cambiar_esta_password}@postialo-db:5432/postialo_mailing
      SESSION_SECRET: ${SESSION_SECRET:-cambiar_este_secreto}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 5000
      NODE_ENV: production
    volumes:
      - postialo_uploads:/app/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - postialo-net

volumes:
  postialo_pgdata:
  postialo_uploads:

networks:
  postialo-net:
    driver: bridge
